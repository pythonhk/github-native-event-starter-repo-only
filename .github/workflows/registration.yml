name: Participant registration validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'requests/users/*.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: registration / actor-binding
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - id: eventctl
        name: Resolve pinned eventctl
        uses: ./.github/actions/eventctl
        with:
          test-bin: ${{ env.EVENTCTL_E2E_BIN }}

      - name: Verify the event-bound registration
        env:
          EVENTCTL: ${{ steps.eventctl.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_SOURCE_TIME: ${{ github.event.pull_request.created_at }}
        shell: bash
        run: |
          set -Eeuo pipefail
          paths="$RUNNER_TEMP/changed-paths"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${EVENT_REPOSITORY}/pulls/${EVENT_PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$paths"
          test "$(wc -l < "$paths" | tr -d ' ')" = 1
          request_path=$(cat "$paths")
          [[ "$request_path" =~ ^requests/users/([1-9][0-9]{0,19})\.json$ ]]
          test "${BASH_REMATCH[1]}" = "$EVENT_AUTHOR_ID"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${EVENT_REPOSITORY}/contents/${request_path}?ref=${EVENT_HEAD_SHA}" \
            > "$RUNNER_TEMP/request.json"
          "$EVENTCTL" identity verify \
            --event event/binding.json \
            --input "$RUNNER_TEMP/request.json" \
            --expect-actor-id "$EVENT_AUTHOR_ID" \
            --source-time "$EVENT_SOURCE_TIME" \
            --output "$RUNNER_TEMP/verified-identity.json"
          printf '%s\n' 'registration request is signed, event-bound, and actor-bound'
