name: Event E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: event / act-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.2"

      - name: Set up Go for act
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Install act
        run: |
          go install github.com/nektos/act@v0.2.88
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare the pinned checkout action for act
        env:
          CHECKOUT_ACTION_SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
        run: |
          set -Eeuo pipefail
          cache="$HOME/.cache/act/actions-checkout.git"
          if [[ ! -d "$cache" ]]; then
            mkdir -p "$(dirname "$cache")"
            # The pytest fixture clones this repository locally to serve the
            # pinned action to act. A partial clone can omit promisor blobs
            # from that local transfer, so keep this small action repository
            # complete even though it remains shallow.
            git clone --depth=1 --no-checkout \
              https://github.com/actions/checkout.git "$cache"
          fi
          git -C "$cache" fetch --no-filter --depth=1 origin "$CHECKOUT_ACTION_SHA"

      - name: Run the act-backed E2E suite
        env:
          ACT_CONTAINER_ARCH: linux/amd64
        run: uv run --python 3.12 --with pytest==8.3.5 --no-project pytest -q tests/e2e
