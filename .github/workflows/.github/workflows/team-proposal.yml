name: Team proposal validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: team / proposal
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate exact request files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/lib/common.sh
          event_require_no_secrets_for_pr
          paths="$RUNNER_TEMP/changed-paths"
          event_changed_paths "$EVENT_REPOSITORY" "$EVENT_PR_NUMBER" "$paths"
          count=$(wc -l < "$paths" | tr -d ' ')
          [[ "$count" == 2 ]] || event_die "team proposal must change exactly 2 files, got $count"
          proposal_path=$(grep -E '^requests/teams/[^/]+/team\.json$' "$paths" || true)
          signatures_path=$(grep -E '^requests/teams/[^/]+/signatures\.json$' "$paths" || true)
          [[ -n "$proposal_path" && -n "$signatures_path" ]] || event_die 'proposal PR must contain team.json and signatures.json only'
          proposal_dir=${proposal_path%/team.json}
          [[ "$signatures_path" == "$proposal_dir/signatures.json" ]] || event_die 'team proposal files must share one registration directory'
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_HEAD_SHA" "$proposal_path" "$RUNNER_TEMP/team.json"
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_HEAD_SHA" "$signatures_path" "$RUNNER_TEMP/signatures.json"
          path_registration=${proposal_path#requests/teams/}
          path_registration=${path_registration%/team.json}
          [[ "$(jq -er '.registration_id' "$RUNNER_TEMP/team.json")" == "$path_registration" ]] || event_die 'proposal path registration ID does not match the signed request'
          status_file="$RUNNER_TEMP/status.json"
          status=$(bash scripts/actions/team-proposal.sh --proposal "$RUNNER_TEMP/team.json" --signatures "$RUNNER_TEMP/signatures.json" --status-out "$status_file")
          jq -e . "$status_file" >/dev/null
          echo "::notice::team proposal status: $status"
