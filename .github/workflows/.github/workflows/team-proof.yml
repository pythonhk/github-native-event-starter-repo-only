name: Team proof validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: team / member-proof
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate actor-bound proof
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/lib/common.sh
          event_require_no_secrets_for_pr
          paths="$RUNNER_TEMP/changed-paths"
          event_changed_paths "$EVENT_REPOSITORY" "$EVENT_PR_NUMBER" "$paths"
          count=$(wc -l < "$paths" | tr -d ' ')
          [[ "$count" == 1 ]] || event_die "proof PR must change exactly one file, got $count"
          proof_path=$(grep -E '^requests/teams/[^/]+/proofs/[1-9][0-9]{0,19}\.json$' "$paths" || true)
          [[ -n "$proof_path" ]] || event_die 'proof PR path is invalid'
          path_actor=${proof_path##*/}
          path_actor=${path_actor%.json}
          [[ "$path_actor" == "$EVENT_AUTHOR_ID" ]] || event_die 'proof filename must equal authenticated actor ID'
          proof_dir=${proof_path%/*}
          registration_dir=${proof_dir%/proofs}
          proposal_path="$registration_dir/team.json"
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_BASE_SHA" "$proposal_path" "$RUNNER_TEMP/team.json"
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_HEAD_SHA" "$proof_path" "$RUNNER_TEMP/proof.json"
          bash scripts/actions/team-proof.sh \
            --proposal "$RUNNER_TEMP/team.json" \
            --proof "$RUNNER_TEMP/proof.json" \
            --actual-author "$EVENT_AUTHOR_ID"
