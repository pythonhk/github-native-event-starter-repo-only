name: Team proposal validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'requests/teams/*/proposal.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: team / proposal
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - id: eventctl
        name: Resolve pinned eventctl
        uses: ./.github/actions/eventctl
        with:
          test-bin: ${{ env.EVENTCTL_E2E_BIN }}

      - name: Check the pending proposal shape and proposer
        env:
          EVENTCTL: ${{ steps.eventctl.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          paths="$RUNNER_TEMP/changed-paths"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${EVENT_REPOSITORY}/pulls/${EVENT_PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$paths"
          test "$(wc -l < "$paths" | tr -d ' ')" = 1
          proposal_path=$(cat "$paths")
          [[ "$proposal_path" =~ ^requests/teams/([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/proposal\.json$ ]]
          team_id=${BASH_REMATCH[1]}
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${EVENT_REPOSITORY}/contents/${proposal_path}?ref=${EVENT_HEAD_SHA}" \
            > "$RUNNER_TEMP/proposal.json"
          "$EVENTCTL" doctor --event event/binding.json > "$RUNNER_TEMP/doctor.json"
          jq -e \
            --arg actor "$EVENT_AUTHOR_ID" \
            --arg team "$team_id" \
            --argjson event "$(jq -c '.result.event' "$RUNNER_TEMP/doctor.json")" \
            '
              (keys_unsorted | sort) == ["event", "expires_at", "issued_at", "kind", "members", "proposer", "signature", "team_id", "v"]
              and .v == 2
              and .kind == "team-proposal"
              and .event == $event
              and .team_id == $team
              and .proposer.actor_id == $actor
              and (.members | type == "array" and length > 0)
              and (.members | all(.[]; (keys_unsorted | sort) == ["actor_id", "key_epoch", "recipient_kid", "signing_kid"]))
              and ([.members[].actor_id] | length == (unique | length) and . == sort_by(tonumber))
              and (. as $proposal | any($proposal.members[]; . == $proposal.proposer))
              and ((.signature | keys_unsorted | sort) == ["alg", "kid", "value"])
            ' "$RUNNER_TEMP/proposal.json" >/dev/null
          printf '%s\n' 'team proposal is pending member consents; organizer verification remains required'
