name: Submission validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: submission / intake
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate untrusted submission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_ID: ${{ github.event.pull_request.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/lib/common.sh
          event_require_no_secrets_for_pr
          paths="$RUNNER_TEMP/changed-paths"
          event_changed_paths "$EVENT_REPOSITORY" "$EVENT_PR_NUMBER" "$paths"
          count=$(wc -l < "$paths" | tr -d ' ')
          [[ "$count" == 2 ]] || event_die "submission PR must change exactly request.json and bundle.eventctl"
          request_path=$(grep -E '^requests/submissions/[^/]+/request\.json$' "$paths" || true)
          bundle_path=$(grep -E '^requests/submissions/[^/]+/bundle\.eventctl$' "$paths" || true)
          [[ -n "$request_path" && -n "$bundle_path" ]] || event_die 'submission PR paths are invalid'
          request_dir=${request_path%/request.json}
          [[ "$bundle_path" == "$request_dir/bundle.eventctl" ]] || event_die 'submission files must share one attempt directory'
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_HEAD_SHA" "$request_path" "$RUNNER_TEMP/request.json"
          event_fetch_pr_blob "$EVENT_REPOSITORY" "$EVENT_HEAD_SHA" "$bundle_path" "$RUNNER_TEMP/bundle.eventctl"
          event_fetch_pr_blob "$EVENT_REPOSITORY" registry registry/state.json "$RUNNER_TEMP/registry.json"
          path_attempt=${request_dir#requests/submissions/}
          [[ "$(jq -er '.attempt_id' "$RUNNER_TEMP/request.json")" == "$path_attempt" ]] || event_die 'submission path attempt ID does not match the signed request'
          bash scripts/actions/submission.sh \
            --request "$RUNNER_TEMP/request.json" \
            --registry "$RUNNER_TEMP/registry.json" \
            --bundle "$RUNNER_TEMP/bundle.eventctl" \
            --actual-author "$EVENT_AUTHOR_ID" \
            --actual-pr "$EVENT_PR_NUMBER" \
            --actual-pr-id "$EVENT_PR_ID" \
            --actual-fork-repository-id "$(jq -er '.pull_request.head.repo.id' "$GITHUB_EVENT_PATH")" \
            --actual-head-owner "$(jq -er '.pull_request.head.repo.owner.login' "$GITHUB_EVENT_PATH")" \
            --actual-head-branch "$(jq -er '.pull_request.head.ref' "$GITHUB_EVENT_PATH")" \
            --actual-head-sha "$EVENT_HEAD_SHA"
