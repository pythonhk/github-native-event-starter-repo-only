  minimum_size: 1
  maximum_size: 5
  proposal_ttl_seconds: 604800
submissions:
  maximum_attempts_per_team: 10
  maximum_total_attempts: 200
  base_branch: main
state:
  branch: registry
  schema: pythonhk.registry-state/v2
  journal_format: hash-linked-json-v2
scoring:
  mode: external_judge
  enabled: false
