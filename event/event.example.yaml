schema: pythonhk.event-config/v2
event_id: replace-with-event-id
event_epoch: "1"
phase: draft
enabled: false
base_repository:
  owner: pythonhk
  name: replace-with-event-repository
  id: "0000000000000000001"
terms:
  path: event/terms.md
  sha256: replace-with-terms-digest
